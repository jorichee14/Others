# Tier 4. The integration, and the claim phase 6 is actually testing.
name: rgbd_inertial_radar
family: fusion
origin: "[O] the combination is not standard; that is the contribution"
modality: [rgbd]
coupling: loose
needs_imu: true
loop_closure: true              # inherited from the visual source
outputs: [trajectory, map]
reference_impl: null            # assembled here from GTSAM factors; no upstream
image: slambench/fusion:humble

streams: [mobile_1.zed_rgbd]
imu_by_agent:
  mobile_1: mobile_1.imu

params:
  # Pose graph: the visual system's relative poses as between-factors, IMU
  # preintegration between them, radar ego-velocity as unary velocity factors on
  # the navigation state. Same architecture as track C's fusion stage — reuse
  # it rather than writing a second one.
  visual_source: null           # REQUIRED: the tier-3 winner's run directory
  radar_source: null            # REQUIRED: radar_inertial_odometry's velocity series
  velocity_factor_sigma_mps: 0.15
  optimiser: isam2

notes: |
  LOOSE ON PURPOSE. Adding a velocity factor inside ORB-SLAM3 means modifying
  ORB-SLAM3; doing it in a pose graph outside means composing three things that
  already work. The loose version is a week cheaper and it answers the question.
  If it shows a gain worth chasing, the tight version becomes a justified piece
  of work rather than a speculative one.

  THE HONEST EXPECTATION, WRITTEN BEFORE THE RUN. On a well-lit 156 s lab lap,
  vision does not fail much — so this row will probably show NO whole-run ATE
  gain over its tier-3 source. That is a real result and rule 8 says it is
  reported with its number.

  Which is why the claim is made somewhere narrower and defensible. Radar
  ego-velocity bounds VELOCITY drift, and it can only pay where vision was
  actually starved. Use the two per-frame instruments that already exist —
  slambench/observability.py for the geometric side, ORB feature count and
  spread for the photometric one — to select the frames where the camera had
  little to work with, and report this row's gain over its source ON THOSE
  SEGMENTS, beside the whole-run number and labelled as the narrower claim.

  That is the difference between a finding this sequence can support and a
  headline it cannot. If the instruments find no starved segments at all, then
  coop2 cannot test this proposition, and the deliverable becomes a scoping
  statement for a sequence that can: darker, faster, or with a stretch of blank
  wall deliberately in shot.
