# Tier 0 for the CONSTRAINED agent. Already in the bag; nothing to run.
name: cuvslam_odom
family: recorded_baseline
origin: "[I] closed-source (NVIDIA Isaac ROS cuVSLAM), run on the cart at record time"
modality: [rgbd]
uses_imu_internally: true
coupling: closed
needs_imu: false
loop_closure: false             # tracking/odometry; the slam_path topic carries its LC arm
outputs: [trajectory]
reference_impl: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_visual_slam
image: null
kind: recorded_baseline
source_topic: /mobile_2/visual_slam/tracking/odometry     # 4233 msgs, 28.9 Hz
covariance_topic: /mobile_2/visual_slam/tracking/vo_pose_covariance

streams: [mobile_2.realsense_rgbd]

params: {}

notes: |
  mobile_2's incumbent, and a DIFFERENT KIND of incumbent from the ZED rows:
  cuVSLAM here runs STEREO-inertial on the RealSense's infra1/infra2 IR pair —
  the one rig on this recording with a genuine stereo baseline, and the IR
  projector supplies texture where passive stereo has none. Do not transfer
  mobile_1's 6 m ZED verdict onto it; it is unmeasured until scored.

  PROVENANCE RESOLVED 2026-09-19: mobile_2's /global_pose IS derived from this
  cuVSLAM plus the pipeline's anchoring. So the measured T0 score (0.183 m RMSE,
  0.73% drift, scale 0.977) is SELF-AGREEMENT, not accuracy — it measures what
  the anchoring step changed: a -2.3% scale correction and ~18 cm of shape
  adjustment. The row is daggered against that reference permanently.

  What still counts for this method: the board dwells (tier 2) and, once the
  chain is validated, the infra_1 residuals — the only evidence about mobile_2
  that does not descend from cuVSLAM itself. Until those speak, cuVSLAM's
  accuracy on this sequence is UNKNOWN, however good it looks against its own
  anchored descendant.

  HOW TO READ ITS SCORE. mobile_2's /global_pose is itself the output of a
  pipeline with no LiDAR behind it — the very reference this project exists to
  replace — so ATE against it is agreement between two unproven estimates. The
  evidence that counts for this row is tier 2 (its boards: rs_anchor at the
  start, anchor_b mid-run, anchor at the end) and the infra residuals, once
  the infra chain itself checks out.

  If it passes those, it is the leading BACKBONE candidate for mobile_2's
  pseudo-GT construction: recorded, stereo-inertial, covariance-carrying —
  and then, per the producer-exclusion rule, it leaves mobile_2's B1 peer
  table and its row is daggered there.
