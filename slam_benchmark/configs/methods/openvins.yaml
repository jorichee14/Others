# DEFERRED, 2026-09-17 -- not run in phase 6. Kept because the decision and its
# reversal condition are worth recording; deleting it would lose both.
#
# WHY NOT. Two reasons, and the first is the one that matters.
#
# 1. It varies the estimator AND the sensor set against every RGB-D-inertial row
#    at once, so a difference cannot be attributed to either. That is precisely
#    the comparison the README refuses -- it is why KISS-ICP is the bridge -- and
#    orbslam3_mono_inertial gets the mono-inertial number by varying the depth
#    input ALONE, on the same codebase and the same calibration.
# 2. The role first claimed for it here was wrong. It was put in as the hedge
#    against an ORB-SLAM3 inertial-init failure, on the grounds that OpenVINS can
#    initialise from a static period. Static init recovers gravity and the biases;
#    it does NOT recover scale, and monocular scale needs translational
#    excitation. On near-constant-velocity pushcart motion OpenVINS is therefore
#    the FIRST entry to fail, not the fallback.
#
# WHEN IT BECOMES WORTH RUNNING: once the right image is recorded. As
# STEREO-inertial it is metric without relying on the IMU for scale, it is a
# strong entry on its own terms, and the filter-versus-optimiser question against
# ORB-SLAM3 becomes clean because both sides would then see the same geometry.
# That is a next-sequence entry, not a coop2 one.
status: deferred
deferred_reason: varies estimator and sensor at once; mono scale unobservable on
                 this motion. Revisit when the right image exists.
name: openvins
family: visual_inertial_odometry
origin: "[I/O]"
modality: [rgbd]                # the STREAM is rgbd; this method consumes the
                                # image and the IMU and IGNORES the depth
coupling: tight
needs_imu: true
loop_closure: false             # MSCKF odometry, no global optimisation
outputs: [trajectory]
reference_impl: https://github.com/rpng/open_vins
image: slambench/openvins:humble

streams: [mobile_1.zed_rgbd]
imu_by_agent:
  mobile_1: mobile_1.imu

params:
  use_stereo: false             # FORCED: only the left image was recorded.
                                # There is no /mobile_1/zed/right/* on this bag.
  max_cameras: 1
  num_pts: 200
  fast_threshold: 15
  grid_x: 5
  grid_y: 3
  # A filter, so it wants the noise model as much as ORB-SLAM3 does. I14.
  gyroscope_noise_density: null
  gyroscope_random_walk: null
  accelerometer_noise_density: null
  accelerometer_random_walk: null
  T_imu_cam0: null              # I13

notes: |
  Its role is to answer ONE question the RGB-D rows cannot: does a filter handle
  this motion better than a batch optimiser? ORB-SLAM3 initialises inertially by
  solving a MAP problem that needs excitation; OpenVINS can initialise from a
  STATIC period instead, which — if I15 finds the run starts stationary — makes
  it the hedge against an ORB-SLAM3 init failure.

  READ IT IN ITS OWN BLOCK, NOT AGAINST THE RGB-D ROWS. OpenVINS is a
  monocular/stereo VIO and does not consume depth, and only the left image
  exists on this bag, so here it is strictly MONOCULAR-inertial. That means its
  SCALE comes from the IMU alone — and this is the worst motion for that.
  Constant velocity makes scale and accelerometer bias weakly observable, and
  unlike the RGB-D entries it has no depth to pin the metric down.

  So the honest prediction is a scale error, and a large ATE that is mostly
  scale rather than shape. Report an additional sim3-aligned ATE for this row
  ALONE, labelled, next to its se3 number: the difference between the two is
  how much of its error was scale, which is the finding. Do not put the sim3
  number in the headline table, and do not let a good sim3 ATE here be read as
  competitive with a metric method.

  A note on what this row is NOT evidence about: if it loses badly, that is not
  evidence that filters lose to optimisers, only that mono-inertial lost to
  RGB-D-inertial on a sequence built for depth. The clean filter-vs-optimiser
  comparison needs the right image, which is a next-session fix.
