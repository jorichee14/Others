# ============================================================================
# coop2_20260828 as a SLAM benchmark sequence.
#
# Every geometry number here is copied from ../rosbag_to_opv2v/configs/
# mirc_coop2.yaml, which derived them from the recording's own published
# transforms. Do not re-derive them by hand; if that file changes, change this
# one in the same commit.
#
# What this config is FOR: telling the evaluator which frame each method's
# output describes, what the reference is and how much it can be trusted, and
# over what volume a map is scored. It does not run anything — see
# configs/methods/*.yaml and scripts/run_method.py.
# ============================================================================

dataset:
  name: coop2_20260828
  bag: ~/workspaces/isaac_ros-dev/data/raw/20260828/mirc_dataset_coop2_20260828_completed
  duration_s: 156.0
  site: MIRC indoor laboratory, NYCU Guangfu campus
  # The surveyed boards span ~8.5 m x ~14.3 m (16.6 m corner to corner) and all
  # sit within ~15 cm of one height. This is a room, not a road: it sets the
  # scale at which every threshold in `eval` below has to be chosen, and it is
  # why the F-score thresholds are 2-10 cm rather than the 20-50 cm an outdoor
  # SLAM paper would quote.
  extent_m: {span_x: 8.5, span_y: 14.3, diagonal: 16.6}
  world: {frame_id: map, gravity_axis: z}

# ---------------------------------------------------------------- the reference
#
# READ THIS BEFORE QUOTING ANY ATE FROM THIS SEQUENCE.
#
# /mobile_*/global_pose is the OUTPUT OF AN OFFLINE MAPPING PIPELINE (stage 09:
# the corrected trajectory, anchored to a surveyed map). It is not an external
# measurement of where the robots were. Benchmarking a SLAM system against it
# measures AGREEMENT WITH THAT PIPELINE. A method that agrees with it perfectly
# has reproduced the pipeline, not the truth; a method that disagrees may be the
# more accurate of the two and there is nothing in tier 1 that can tell.
#
# The independent evidence is the board survey, and it is what `uncertainty_m`
# below is taken from — the WORST of the three boards, not the best, because a
# claim has to survive the loosest anchor in the frame it is made in.
reference:
  kind: pipeline                 # pipeline | survey | external-tracker
  produced_by: glim+scan_to_map  # NAME IT. What produced the reference decides
                                 # which methods can be scored against it —
                                 # see `correlated_with`.
  provenance: >
    GLIM (ros2) supplies the SEED trajectory only. Stage 01a then re-derives
    every pose by registering each scan into a frozen reference map — the
    survey-prior construction used by Newer College, Oxford Spires and ConSLAM,
    with a self-built prior map rather than a survey-grade one. Two-stage ICP
    (planarity-weighted local plane fits, then a nearest-neighbour polish),
    Tikhonov damping toward the seed in geometrically unobservable directions,
    and several rounds each rebuilding the reference map from the previous
    round's poses. Stage 01 then builds the map from those refined poses, with
    per-point deskew, free-space carving for dynamics, and anchoring to the
    surveyed boards.

    The property that makes this a REFERENCE rather than another SLAM result:
    every scan is initialised from its seed pose, never from the previous
    scan's refined pose, so error cannot accumulate along the trajectory. No
    odometry system has that property, KISS-ICP included.
  # NOT the same as circularity. The reference does not contain GLIM's
  # trajectory — it contains GLIM's BASIN. Stage 01a rejects any correction
  # beyond max_shift (0.5 m) / max_rot (5 deg) and keeps the seed, so wherever
  # GLIM was wrong by more than that, the reference inherits the error and
  # online GLIM would agree with it. Correlated errors, not identical ones.
  # A GLIM row is therefore an ablation ("what do refinement and anchoring
  # add"), never a peer row. Every other method is scored normally.
  correlated_with: [glim]
  # The convergence statistic stage 01a prints — median per-round correction
  # falling to millimetres — is PRECISION, not accuracy: a trajectory and a map
  # can converge to a consistent solution that is jointly wrong, which is
  # exactly what the corridor-degenerate directions `prior_beta` exists to damp.
  # Only the board survey bounds the accuracy, which is why uncertainty_m below
  # is taken from it and not from the convergence table.
  # 15 mm: rs_anchor's std. anchor itself is repeatable to ~3 mm (6.9 mm std,
  # 3.2 mm loop closure over 526.9 s), anchor_b to ~13 mm honestly stated. Set
  # this to 0.007 only for a claim restricted to the region near `anchor`.
  uncertainty_m: 0.015
  # Fill from the map cloud before running map metrics; see eval.volume.
  map_cloud: null
  agents:
    mobile_1:
      # RESOLVED by phase0 on the bag (2026-09-19): 1516 poses at 9.70 Hz — one
      # per LiDAR sweep, as a LiDAR-derived reference should be. The 2833/18.1 Hz
      # this file once carried was stale. Export measured: 151.5 s, 25.82 m of
      # path, first pose 32.4 mm from the declared anchor (check passed).
      topic: /mobile_1/global_pose        # 1516 msgs, 9.70 Hz, measured
      frame: zed_left_camera_optical_frame
      expected_start: [0.697952, -0.062696, 0.193334]
      max_gap_ms: 200
    mobile_2:
      # PROVENANCE ESTABLISHED 2026-09-19: this trajectory is DERIVED FROM
      # cuVSLAM (Isaac ROS, stereo-IR + IMU) plus the pipeline's anchoring.
      # It is an odometry product, not an independent reference. Consequences:
      #   * scoring cuVSLAM against it is SELF-AGREEMENT. The measured
      #     0.18 m / 0.73% / scale 0.977 do not state cuVSLAM's accuracy; they
      #     state what the anchoring step changed (a -2.3% scale correction
      #     and ~18 cm of shape adjustment).
      #   * the ONLY independent evidence about mobile_2 is: the board dwells
      #     (tier 2), the infra_1 observations (once that chain is validated),
      #     and co-observation with mobile_1. This is the pseudo-GT project's
      #     motivating gap, now confirmed rather than suspected.
      #   * any method sharing cuVSLAM's sensors/front-end is correlated with
      #     this reference — same rule as GLIM against the mobile_1 pipeline.
      correlated_with: [cuvslam]
      topic: /mobile_2/global_pose        # 1811 msgs, ~11.6 Hz
      frame: camera_color_optical_frame
      expected_start: [7.704074, -14.308017, 0.165040]
      max_gap_ms: 250
  # Tier 2, the absolute check. `position` is the surveyed board origin in `map`;
  # `window` is the interval the platform dwelled in front of it, which is NOT in
  # the bag metadata and has to be read off the run once. Until a window is
  # filled the anchor is skipped and the evaluator says so rather than scoring a
  # tier it could not compute.
  anchors:
    - name: anchor
      position: [0.0, 0.0, 0.0]
      uncertainty_m: 0.007            # 6.9 mm std over 214 views; loop closure 3.2 mm
      window: null                    # confirmed window; fill from the candidates below
      # phase0 candidates (t+ seconds into each agent's reference; CONFIRM BY EYE):
      #   mobile_1: [0.2, 6.5]                                  <- starts here
      #   mobile_2: [84.3, 88.2], [92.9, 124.6], [133.3, 146.6] <- ends here
      window_candidates_unconfirmed: true
      note: the map frame's origin, and the only anchor tight enough to resolve
            a centimetre-scale difference between methods
    - name: anchor_b
      position: [8.033, -7.182, -0.102]
      uncertainty_m: 0.013            # the honest figure: 12.9 mm / 2.6 deg between
      window: null                    # its two sections (ratio 4.24, significant).
      # phase0 candidates: mobile_1 NEVER dwells here; mobile_2: [42.6, 50.0].
      # So this board anchors mobile_2 only — mobile_1's graph gets two boards,
      # not three, and its tier-2 check is two points.
      note: its quoted 2.0 mm is the spread WITHIN a section and understates it
    - name: rs_anchor
      position: [8.460, -14.267, -0.056]
      uncertainty_m: 0.015            # std; max residual 40 mm, 1 of 2 sections gated
      window: null
      # phase0 candidates: mobile_1: [115.7, 151.5] (ends parked here);
      # mobile_2: [0.0, 20.6] (starts here). The agents SWAP corners over the
      # run — which is also why place overlap came back 100%.
      note: the loosest of the three; a residual under ~40 mm against this board
            is not evidence of anything

# ------------------------------------------------------------------- streams
#
# What a SLAM method can be fed. `reference_frame_from_sensor` is the transform
# the evaluator right-multiplies out before comparing: it is `reference frame
# <- sensor frame` on that agent, in the same sense as the `extrinsic:` blocks
# of the converter config (`base_link -> sensor`). Leaving it wrong is the
# single most effective way to produce a benchmark that runs and lies: on this
# rig the Ouster's 13 cm lever arm and 90 deg rotation from the ZED optical
# frame shows up as several centimetres of ATE that no alignment can absorb,
# and it looks exactly like drift.
streams:

  mobile_1.ouster:
    agent: mobile_1
    modality: lidar
    topic: /mobile_1/ouster/points        # 1516 msgs, 9.7 Hz, 128 beams, ~130k pts
    sensor_frame: os_lidar
    reference_frame_from_sensor: {x: 0.067064, y: -0.092192, z: -0.074147,
                                  roll: 2.2959, pitch: 89.5267, yaw: -87.6614}
    point_time_field: t                   # ns from the header stamp
    deskew: true                          # a 103 ms sweep at walking pace is not an instant
    rate_hz: 9.7
    note: the only true LiDAR on the sequence. Everything in the LiDAR-only block
          runs on this one stream, so that block compares METHODS; the
          cross-modality comparison needs one method run on several streams.

  mobile_1.zed_rgbd:
    agent: mobile_1
    modality: rgbd
    depth_topic: /mobile_1/zed/depth/depth_registered     # 2291 msgs, 14.7 Hz, 32FC1 m
    depth_info_topic: /mobile_1/zed/depth/camera_info
    color_topic: /mobile_1/zed/left/image_rect_color
    color_info_topic: /mobile_1/zed/left/camera_info
    sensor_frame: zed_left_camera_optical_frame
    # Identity, and measured rather than assumed: the reference pose IS this
    # frame, and "registered" means the depth is already in it.
    reference_frame_from_sensor: {x: 0, y: 0, z: 0, roll: 0, pitch: 0, yaw: 0}
    depth_scale: 1.0
    range_m: [0.3, 12.0]
    rate_hz: 14.7
    note: runs on the SAME trajectory as mobile_1.ouster. That is what makes the
          LiDAR-vs-RGB-D comparison on this sequence clean — same platform, same
          motion, same clock, one reference.

  mobile_2.realsense_rgbd:
    agent: mobile_2
    modality: rgbd
    depth_topic: /mobile_2/depth/image_rect_raw           # 4300 msgs, 27.5 Hz, 16UC1 mm
    depth_info_topic: /mobile_2/depth/camera_info
    color_topic: /mobile_2/color/image_raw
    color_info_topic: /mobile_2/color/camera_info
    sensor_frame: camera_depth_optical_frame
    # colour optical <- depth optical, as published. 59 mm, systematic, on every
    # point if left at identity.
    reference_frame_from_sensor: {x: 0.059190, y: -0.000010, z: -0.000406,
                                  roll: -0.3398, pitch: 0.0958, yaw: 0.1493}
    depth_scale: 0.001
    range_m: [0.2, 10.0]
    rate_hz: 27.5
    note: ~87 deg horizontal FoV and a few metres of usable range. A different
          platform and a different route from mobile_1, so a result here is not
          a like-for-like against mobile_1.zed_rgbd — use that pair for the
          modality comparison and this one for the second-platform check.

  # I12 RESOLVED 2026-09-17: the radar clouds DO carry a Doppler field, so these
  # two are live inputs to phase 6 tier 4. Field layout READ OFF THE BAG
  # (phase0 2026-09-19): x,y,z,doppler,intensity — all float32, on all three
  # radars. Only the SIGN convention remains open; resolve it against one
  # known-motion segment before the ego-velocity front-end trusts it.
  mobile_1.radar1:
    agent: mobile_1
    modality: radar
    topic: /mobile_1/radar1/radar/points_all    # 2470 msgs, 15.8 Hz
    doppler: true
    doppler_field: doppler                # measured off the bag, phase0 2026-09-19
    sensor_frame: radar1_link
    reference_frame_from_sensor: {x: 0.207505, y: 0.076150, z: -0.108883,
                                  roll: -174.5848, pitch: -76.2388, yaw: -95.2193}
    note: >
      IWR6843, order 1e1-1e2 points per frame. Still NOT a scan-matching input:
      ICP on tens of points indoors is a research contribution, not a baseline.
      What the Doppler field buys instead is EGO-VELOCITY. RANSAC plus least
      squares over each sweep's (azimuth, elevation, radial velocity) triples
      returns a 3D body velocity, which enters an estimator as a velocity
      factor rather than as geometry. radar1 and radar2 sit ~120 deg apart in
      yaw, which conditions that solve far better than either alone, since a
      single unit observes the component across its boresight only weakly.
      Ablation E measures whether the second unit earned its place.

  mobile_1.radar2:
    agent: mobile_1
    modality: radar
    topic: /mobile_1/radar2/radar/points_all    # 2448 msgs, 15.7 Hz
    doppler: true
    doppler_field: doppler                # measured off the bag, phase0 2026-09-19
    sensor_frame: radar2_link
    reference_frame_from_sensor: {x: -0.053850, y: 0.046553, z: -0.112039,
                                  roll: 160.0651, pitch: -86.7452, yaw: 24.8992}

  infra_1.radar:
    agent: infra_1
    modality: radar
    topic: /infra_1/radar/points_all      # 1343 msgs, 8.6 Hz
    sensor_frame: infra1_link
    static_world_pose: {x: -5.508181, y: -2.590753, z: 1.998232,
                        roll: -117.6730, pitch: 0.7379, yaw: -127.6503}
    reference_frame_from_sensor: {x: 0.017773, y: -0.208023, z: -0.155788,
                                  roll: 176.0934, pitch: -73.1656, yaw: 92.1354}
    note: a STATIC agent, so it has no trajectory to estimate. Its value to this
          benchmark is the opposite one — it is an external observer of the two
          mobile platforms, from a surveyed pose, with a clock of its own. See
          IMPLEMENTATION.md phase 4.

  # I1 RESOLVED from the recording's topic table: this bag carries THREE IMUs.
  # mobile_1 has two, and which one a method may use is a scoping decision, not
  # a hardware one -- see docs/MOBILE1_LIDARFREE_ODOMETRY.md Q2. The ZED's is
  # the default for every visual-inertial entry: twice the rate, and rigid and
  # factory-calibrated to the camera it is being fused with.
  #
  # What is still MISSING is the part that decides whether an inertial result
  # means anything, and it is NOT filled in below because it is not recoverable
  # from the topic table:
  #   - the IMU<-sensor extrinsics (I5 for the LiDAR; Q4 for the camera). Only
  #     3 messages on /tf_static for this whole rig -- verify what is in them
  #     rather than assuming the ZED chain is.
  #   - the noise model (white noise + random walk). Stated nowhere. Allan
  #     variance off a static segment if the run has one; datasheet otherwise,
  #     and then every tightly-coupled row says so beside its number.
  mobile_1.imu:
    agent: mobile_1
    modality: imu
    present: true
    topic: /mobile_1/zed/imu/data         # 30067 msgs, 192.4 Hz
    rate_hz: 192.4
    sensor_frame: zed_imu_link
    magnetometer_topic: /mobile_1/zed/imu/mag   # 7596 msgs, 48.6 Hz

    # The camera is a ZED 2 or ZED 2i, DEDUCED rather than read off a label:
    # the magnetometer topic is the discriminator, since ZED Mini and ZED X
    # carry no magnetometer and the original ZED carries no IMU at all. The
    # 192.4 Hz corroborates it -- the wrapper's default sensor rate is 200 Hz,
    # and 192.4 is that with a few drops. Confirm against the serial before
    # quoting it; the deduction is sound but it is still a deduction.
    model_inferred: zed_2_or_2i

    # REQUIRED before any TIGHTLY-coupled VIO (orbslam3_rgbd_inertial, openvins).
    # NOT required by the loosely-coupled rows, which is why the ladder runs
    # today. Three independent routes, in order of preference:
    #   1. the ZED SDK, which is authoritative and does not depend on the bag:
    #        getSensorsConfiguration().camera_imu_transform
    #   2. /usr/local/zed/settings/SN<serial>.conf, the factory calibration
    #   3. /tf_static. Only 3 messages, but TFMessage carries an ARRAY and
    #      there are exactly 3 static publishers here (mobile_1, mobile_2,
    #      infra_1), so the chain is plausibly all inside one of them.
    #
    # Whichever route: the wrapper publishes zed_imu_link against
    # zed_camera_center, and this benchmark's reference frame is
    # zed_left_camera_optical_frame. The chain therefore crosses the ROS-body
    # to optical convention change, and getting that rotation wrong yields a
    # transform that is plausible, silent and wrong -- the same class of defect
    # the precheck already caught once (see IMPLEMENTATION.md, 2026-09-15).
    # I13 RESOLVED 2026-09-19. Source: the ZED wrapper's published static TF on
    # the cart (per-unit factory calibration; the .conf file does NOT carry it).
    #   zed_left_camera_frame -> zed_imu_link :
    #     t = [-0.002000, -0.023061, 0.000217] m        (23.1 mm lever arm)
    #     q_xyzw = [-0.00847435, -0.00061121, 0.00738261, 0.99993658]
    #     total misalignment 1.290 deg (rpy -0.972, -0.063, +0.847)
    # That 1.29 deg IS the per-unit part a nominal transform would have missed:
    # ~g*sin(1.29 deg) = 0.22 m/s^2 of gravity leak on every rotation.
    # Composed forms live in the tightly-coupled method configs (IMU.T_b_c1).
    # Sanity-checked: imu +z maps to optical [-0.017, -1.000, -0.001] ~= -y = up.
    # Remaining verification: the gravity check against a static SEGMENT of the
    # run's own IMU stream, once one is identified.
    extrinsic_from_camera:
      parent: zed_left_camera_frame
      child: zed_imu_link
      xyz: [-0.002000, -0.023061, 0.000217]
      quat_xyzw: [-0.00847435, -0.00061121, 0.00738261, 0.99993658]

    # NOT RECOVERABLE FROM THIS BAG, and `null` rather than a guess per rule 3.
    # Allan variance needs hours of static logging -- the bias random-walk terms
    # only emerge at cluster times of 1e2-1e3 s -- and this recording is 156 s.
    # A static segment inside it, if one exists, bounds the WHITE NOISE only and
    # says nothing about the random walks.
    #
    # The fix is one overnight and no effort: park the camera on a desk, record
    # /zed/imu/data for 3+ hours, run allan_variance_ros. It is a property of
    # the unit, so it is measured once and serves every future recording.
    #
    # Until then the tightly-coupled rows carry order-of-magnitude values in
    # their METHOD config (rule 7: declared once, provenance named beside it),
    # never here. Err HIGH: over-stated noise makes an estimator distrust the
    # IMU and degrade gracefully toward vision-only, while under-stated noise
    # makes it over-trust the IMU and diverge. The asymmetry is not symmetric
    # and the safe side is known.
    noise_model: null

    # EXCLUDED by scoping decision, 2026-09-17: the user's answer to Q2 is that
    # the Ouster's IMU counts as using the LiDAR. It is therefore off-limits for
    # this agent, the IMU-source ablation is dropped, and /mobile_1/ouster/imu
    # (15137 msgs, 96.9 Hz, os_imu) is recorded here only so the exclusion is a
    # decision on the record rather than an oversight.
    excluded:
      topic: /mobile_1/ouster/imu
      reason: counts as using the LiDAR (user scoping decision)
  mobile_2.imu:
    agent: mobile_2
    modality: imu
    present: true
    topic: /mobile_2/imu                  # 28646 msgs, 183.3 Hz
    rate_hz: 183.3
    sensor_frame: null                    # not yet read off the bag
    extrinsic_from_camera: null
    noise_model: null

  # ------------------------------------------------- already-recorded baselines
  #
  # The ZED SDK's own visual-inertial odometry is IN THE BAG. It costs nothing
  # to score and it is the bar any open-source entry on this platform has to
  # clear, so it is scored BEFORE any container is built. See
  # docs/MOBILE1_LIDARFREE_ODOMETRY.md, step T0.
  mobile_1.zed_sdk_odom:
    agent: mobile_1
    modality: rgbd_inertial
    topic: /mobile_1/zed/odom             # 2292 msgs, 14.7 Hz
    kind: recorded_baseline
    loop_closure: false
    sensor_frame: zed_left_camera_optical_frame
    reference_frame_from_sensor: {x: 0, y: 0, z: 0, roll: 0, pitch: 0, yaw: 0}
    note: closed-source. A row, not a method -- it cannot be ablated, so it sets
          the bar without ever explaining it.
  mobile_1.zed_sdk_pose:
    agent: mobile_1
    modality: rgbd_inertial
    topic: /mobile_1/zed/pose             # 2200 msgs, 14.1 Hz
    kind: recorded_baseline
    loop_closure: true                    # spatial memory / area memory
    sensor_frame: zed_left_camera_optical_frame
    reference_frame_from_sensor: {x: 0, y: 0, z: 0, roll: 0, pitch: 0, yaw: 0}

# ---------------------------------------------------------------- evaluation
eval:
  # Trajectory
  alignment: se3                 # none | se3 | sim3 | yaw. se3 for metric sensors;
                                 # sim3 only for a monocular entry, and then say so.
  align_n_first: null            # e.g. 100 to anchor on the start and measure drift
                                 # away from it rather than best-fitting the whole run
  max_gap_s: 0.25                # a reference gap wider than this is a dropout, and
                                 # queries inside it are dropped, not interpolated
  rpe_deltas:
    - {delta: 1.0, unit: m}      # the honest discriminator on a 16 m room: the
    - {delta: 5.0, unit: m}      # reference is far more trustworthy over 1 m than
    - {delta: 10.0, unit: s}     # over the whole sequence
  revisit: {radius_m: 0.30, min_separation_s: 20.0}

  # Map. Both of these are CHOICES that change the ranking, so both are stated in
  # the write-up next to the numbers.
  volume: {min: null, max: null}
  # REQUIRED before map metrics. Take it from the anchored map cloud, not from
  # the trajectories: a volume fitted to where the robots went scores every
  # method only where it was already confident. A defensible choice is the
  # axis-aligned box of the map cloud's occupied space, eroded by 0.25 m so
  # boundary effects at the walls do not dominate completeness.
  resolution_m: 0.02             # rho. Do not go below the reference map's own
                                 # anchoring spread (3 mm best board, 15 mm worst) —
                                 # below that this benchmark is measuring the survey.
  truncate_m: 0.50               # distances beyond this are clamped AND the clamped
                                 # fraction is reported; a mean over a 40%-truncated
                                 # cloud is a coverage number wearing a distance's units
  fscore_thresholds_m: [0.02, 0.05, 0.10]
  map_frame: aligned             # aligned | raw. `aligned` applies the trajectory's
                                 # own ATE alignment to the map first, so map quality
                                 # is scored GIVEN re-localisation; `raw` includes the
                                 # method's drift in the map score. Different
                                 # experiments; report which.
