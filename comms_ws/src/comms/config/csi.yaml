/**/csi_publisher:
  ros__parameters:
    interface: wlan0
    # Must match what the transmitters are actually using — check with
    # `iw dev <iface> info` on each of them. The chip tunes to ONE chanspec,
    # so every transmitter you want to capture has to share it.
    channel: "149/80"
    # Comma-separated source MACs of the transmitters you control. Each one
    # gets its own /mobileN/csi topic, numbered by position in this list.
    # Leave empty to capture from every device on the channel — useful for
    # debugging, useless for data: mixed transmitters use different
    # bandwidths and the profile smears.
    mac_filter: "88:76:b9:ea:e0:ff,88:76:b9:ea:e1:01"
    # One topic per MAC above, positional. No leading slash = relative to this
    # node's namespace, so `csi.launch.py namespace:=infra_1` publishes
    # /infra_1/mobile_1/csi and /infra_1/mobile_2/csi: infra_1's view of each
    # robot's channel. Use a leading slash to pin absolute names instead.
    # Empty falls back to mobile1/csi, mobile2/csi by position.
    mac_topics: "mobile_1/csi,mobile_2/csi"
    core_mask: 1
    nss_mask: 1
    # -b filters on the frame's FIRST BYTE, not the MAC. 0x88 = QoS Data. On a
    # channel dominated by Block Acks (0x94) it rejects nearly everything.
    frame_control_filter: ""
    port: 5500
    arm_on_start: true
    arm_attempts: 5
    trim: false
    calib_frames: 300
    frame_id: wlan0
    status_period: 2.0
