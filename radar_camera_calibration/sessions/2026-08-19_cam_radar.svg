<text x="30" y="392" class="h">Reading it</text>
<text x="30" y="414" class="nb">Position of the radar, from the lens centre</text>
<text x="30" y="433" class="n">&#160;&#160;20.8 cm to the RIGHT</text>
<text x="380" y="433" class="l">camera +X</text>
<text x="30" y="452" class="n">&#160;&#160;7.6 cm DOWN</text>
<text x="380" y="452" class="l">camera +Y is down</text>
<text x="30" y="471" class="n">&#160;&#160;10.9 cm BEHIND the lens</text>
<text x="380" y="471" class="l">camera +Z is forward</text>
<text x="30" y="490" class="n">&#160;&#160;straight-line separation 24.6 cm</text>
<text x="30" y="509" class="n"></text>
<text x="30" y="528" class="nb">Orientation</text>
<text x="30" y="547" class="n">&#160;&#160;boresight is 13.8&#176; off the optical axis</text>
<text x="380" y="547" class="l">+13.7&#176; up, -1.2&#176; right</text>
<text x="30" y="566" class="n">&#160;&#160;roll about the boresight 1.3&#176;</text>
<text x="380" y="566" class="l">upright, not inverted</text>
<text x="560" y="392" class="h">Numbers</text>
<text x="560" y="414" class="m">t (m)&#160;&#160;&#160;&#160; +0.207505 +0.076150 -0.108883</text>
<text x="560" y="433" class="m">quat xyzw -0.551338 +0.560743 -0.443155 -0.430356</text>
<text x="560" y="452" class="m"></text>
<text x="560" y="471" class="m">p_cam = R &#183; p_radar + t</text>
