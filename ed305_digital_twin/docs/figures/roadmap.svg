<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 280' width='760' height='280' font-family='Helvetica, Arial, sans-serif' font-size='11.5'><title>PhD roadmap</title><rect width='760' height='280' fill='white'/><defs><marker id='arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8a8984'/></marker></defs><text x='24' y='30' font-size='15' font-weight='600' text-anchor='start' fill='#0b0b0b'>Three years, one paper per layer, each gated by real-data evidence</text><rect x='24' y='56' width='216' height='32' rx='8' fill='#f1f0ec' fill-opacity='1' stroke='#8a8984' stroke-width='1.25'/><text x='132' y='77' font-size='13' font-weight='600' text-anchor='middle' fill='#0b0b0b'>Year 1 · Perception, trust</text><rect x='24' y='96' width='216' height='140' rx='8' fill='none' fill-opacity='1' stroke='#8a8984' stroke-width='1.25'/><text x='36' y='120' font-size='11.5' font-weight='400' text-anchor='start' fill='#0b0b0b'>Calibrated identity and</text><text x='36' y='138' font-size='11.5' font-weight='400' text-anchor='start' fill='#0b0b0b'>existence trust (marginals)</text><text x='36' y='162' font-size='11.5' font-weight='400' text-anchor='start' fill='#0b0b0b'>ED305 dataset with identity</text><text x='36' y='180' font-size='11.5' font-weight='400' text-anchor='start' fill='#0b0b0b'>ground truth</text><text x='36' y='220' font-size='11.5' font-weight='600' text-anchor='start' fill='#0b0b0b'>Paper: tracker + dataset</text><rect x='272' y='56' width='216' height='32' rx='8' fill='#f1f0ec' fill-opacity='1' stroke='#8a8984' stroke-width='1.25'/><text x='380' y='77' font-size='13' font-weight='600' text-anchor='middle' fill='#0b0b0b'>Year 2 · Multi-agent</text><rect x='272' y='96' width='216' height='140' rx='8' fill='none' fill-opacity='1' stroke='#8a8984' stroke-width='1.25'/><text x='284' y='120' font-size='11.5' font-weight='400' text-anchor='start' fill='#0b0b0b'>Belief-level fusion of robots</text><text x='284' y='138' font-size='11.5' font-weight='400' text-anchor='start' fill='#0b0b0b'>and room; agent reliability</text><text x='284' y='162' font-size='11.5' font-weight='400' text-anchor='start' fill='#0b0b0b'>What to share per bit of</text><text x='284' y='180' font-size='11.5' font-weight='400' text-anchor='start' fill='#0b0b0b'>task value</text><text x='284' y='220' font-size='11.5' font-weight='600' text-anchor='start' fill='#0b0b0b'>Paper: sharing under bandwidth</text><rect x='520' y='56' width='216' height='32' rx='8' fill='#f1f0ec' fill-opacity='1' stroke='#8a8984' stroke-width='1.25'/><text x='628' y='77' font-size='13' font-weight='600' text-anchor='middle' fill='#0b0b0b'>Year 3 · Coordination</text><rect x='520' y='96' width='216' height='140' rx='8' fill='none' fill-opacity='1' stroke='#8a8984' stroke-width='1.25'/><text x='532' y='120' font-size='11.5' font-weight='400' text-anchor='start' fill='#0b0b0b'>Identity-gated allocation,</text><text x='532' y='138' font-size='11.5' font-weight='400' text-anchor='start' fill='#0b0b0b'>chance-constrained motion,</text><text x='532' y='162' font-size='11.5' font-weight='400' text-anchor='start' fill='#0b0b0b'>value-of-information messages</text><text x='532' y='180' font-size='11.5' font-weight='400' text-anchor='start' fill='#0b0b0b'>on ED305 robots</text><text x='532' y='220' font-size='11.5' font-weight='600' text-anchor='start' fill='#0b0b0b'>Paper + thesis</text><polygon points='245,166 256,155 267,166 256,177' fill='#2a78d6' fill-opacity='0.25' stroke='#2a78d6' stroke-width='2'/><text x='256' y='262' font-size='11.5' font-weight='400' text-anchor='middle' fill='#52514e'>Gate: trust calibrated on real data</text><polygon points='493,166 504,155 515,166 504,177' fill='#2a78d6' fill-opacity='0.25' stroke='#2a78d6' stroke-width='2'/><text x='504' y='262' font-size='11.5' font-weight='400' text-anchor='middle' fill='#52514e'>Gate: robots recorded, synced</text></svg>