% SDK Parameters
% See the SDK user's guide for more information
% "C:\ti\mmwave_sdk_[VER]\docs\mmwave_sdk_user_guide.pdf"
%
% RADAR 1 of 2 — frequency-division band plan (dual-sensor interference fix):
%   This sensor sweeps the LOWER half of the 60-64 GHz band.
%     startFreq 61.75 -> 60.05 GHz
%     occupied band: 60.05 - 61.98 GHz  (ramp BW = 32.71 MHz/us x 59.10 us = 1933 MHz)
%   Radar 2 sweeps 62.05 - 63.98 GHz; ~67 MHz guard band between them, so the
%   two sensors can chirp simultaneously without crossing into each other's
%   RX band. Slope / samples / sample rate are unchanged, so range resolution
%   (~0.16 m), max range (~10.1 m), frame timing and radar-cube memory are
%   identical to the single-sensor config.
%   NOTE: compRangeBiasAndRxChanPhase was measured on the old 61.75-63.68 GHz
%   band; re-run the range-bias/phase calibration at the new band for best
%   angle accuracy.
sensorStop
flushCfg
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
%lvdsStreamCfg -1 0 1 0
adcbufCfg -1 0 1 1 1
lowPower 0 0
bpmCfg -1 0 0 1

