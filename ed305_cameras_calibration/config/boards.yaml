# The lab's ChArUco board (every printed copy is the same board): calib.io 7x9, DICT_4X4_50,
# 9 squares along the long side (footer underneath), 7 along the short side; black square
# 24.5 mm, marker 18 mm. How the board is held does not matter; squares_x/squares_y must match
# the board itself (swapped, OpenCV finds no corners at all). The sizes do not matter for
# intrinsics, only for extrinsics (metres in the room): measure them on each print.
# Identical copies are fine for intrinsics; for extrinsics only one copy may be in the room at a
# time (the cameras cannot tell identical boards apart).
boards:
  A: {dictionary: DICT_4X4_50, squares_x: 9, squares_y: 7, square_m: 0.0245, marker_m: 0.018}
# Floor markers: single AprilTags taped to the floor at surveyed positions (see floor_markers.yaml).
floor_tags:
  dictionary: DICT_APRILTAG_36h11
  size_m: 0.200          # black square edge after printing, measure it
