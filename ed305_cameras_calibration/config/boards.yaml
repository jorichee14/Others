# The lab's ChArUco board (every printed copy is the same board): 9 squares across, 7 down,
# DICT_4X4_50, black square 24.5 cm, marker 18 cm (measured on the print).
# If the dashboard finds no corners on the board, the board is the other way round in the
# camera's eyes: swap squares_x and squares_y.
# Identical copies are fine for intrinsics; for extrinsics only one copy may be in the room at a
# time (the cameras cannot tell identical boards apart).
boards:
  A: {dictionary: DICT_4X4_50, squares_x: 9, squares_y: 7, square_m: 0.245, marker_m: 0.180}
# Floor markers: single AprilTags taped to the floor at surveyed positions (see floor_markers.yaml).
floor_tags:
  dictionary: DICT_APRILTAG_36h11
  size_m: 0.200          # black square edge after printing, measure it
