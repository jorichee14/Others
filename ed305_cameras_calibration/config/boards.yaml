# One ChArUco board per person. Each board uses its own marker dictionary, so three boards can
# be in the room at the same time without confusing the detectors.
# Print each at 100% on A1 landscape (841 x 594 mm). After printing, MEASURE one square with a
# ruler and put the real size here (metres). The marker is 0.75 of the square.
boards:
  A: {dictionary: DICT_4X4_50, squares_x: 11, squares_y: 8, square_m: 0.070, marker_m: 0.0525}
  B: {dictionary: DICT_5X5_50, squares_x: 11, squares_y: 8, square_m: 0.070, marker_m: 0.0525}
  C: {dictionary: DICT_6X6_50, squares_x: 11, squares_y: 8, square_m: 0.070, marker_m: 0.0525}
# Floor markers: single AprilTags taped to the floor at surveyed positions (see floor_markers.yaml).
floor_tags:
  dictionary: DICT_APRILTAG_36h11
  size_m: 0.200          # black square edge after printing, measure it
