# NeST-Splatting on a LiDAR scene from lod3dgs.py scene, trained the way
# LetsGo trains a LiDAR-initialised model (no opacity reset, no growth, the
# points are the geometry) with a one-sided LiDAR depth loss.
#
# Set `range` to the scene's bounds before use -- see README.md. It is the
# cube the texture hash grid covers, in the scene's own (GLIM world) frame.

EXP_COMMENTS: "scoop indoor, LiDAR init"

training_cfg:
  iterations: 70_000                    # LetsGo: twenty times the image count (3462 -> ~70k)
  densify_from_iter: 1_000_000          # never: the LiDAR points are the geometry
  densify_until_iter: 0
  opacity_reset_interval: 1_000_000     # never: with thousands of images a reset never recovers
  reset_until_iter: 0
  position_lr_max_steps: 70_000
  densification_interval: 100
  ingp_densification_interval: 100
  ingp_opacity_reset_interval: 1_000_000
  opacity_reset_protect: 10
  densify_grad_threshold: 0.0002
  ingp_densify_threshold: 0.0004
  opacity_cull: 0.005                   # vanilla's; NeST's 0.05 culls a tenth of a LiDAR init
  sh_degree: 2
  pixel_densify_from_iter: 1_000_000

settings:
  if_ingp: True
  white_background: False
  gt_alpha: False
  gs_alpha: False
  depth_ratio: 1                        # median depth: a bounded, indoor scene
  contract: False                       # the range below holds the whole building
  pixel_densify_enhance: False
  save_interval: 10000

loss:
  lambda_normal: 0.0
  lambda_dist: 0.0
  lambda_mask: 0.0
  lambda_depth: 0.8                     # LetsGo's weight, one-sided (floaters only)
  normal_iter: 7_000
  dist_iter: 3_000
  mask_iter: 0
  depth_iter: 0

ingp_stage:
  initialize: 10_000                    # surfels alone first, as NeST does
  switch_iter: 10_000
  keep_geometry: 1000
  XYZ_TYPE: "UV"

surfel:
  base_beta: 0
  base_opacity: 0
  tg_beta: 0
  tg_base_alpha: 0
  update_interval: 500
  update_interations: 5_000

encoding:
  type: hashgrid
  levels: 6
  hashgrid:
    min_logres: 9                       # 2^9 cells over the range: ~20 cm at 100 m
    max_logres: 13                      # 2^13: ~1.2 cm -- the near field the 4 cm points cannot hold
    dict_size: 22
    dim: 4
    range: [-50, 50]                    # PLACEHOLDER: set from the scene bounds (README)
  coarse2fine:
    enabled: True
    init_active_level: 2
    step: 3000
    warm_up: 1000

rgb:
  mlp:
    num_layers: 2
    hidden_dim: 256
    skip: []
    activ: relu_
    activ_params: {}
    weight_norm: True
  mode: idr
  view_dep: True
  encoding_view:
    type: SphericalHarmonics
    degree: 4

optim:
  type: Adam
  params:
    feat_lr: 2e-2
    view_lr: 2e-2
    mlp_lr: 1e-3
    spec_lr: 2e-4
